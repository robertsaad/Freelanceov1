name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/azure-backend.yml   # allow workflow to run when edited

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv env
          .\env\Scripts\activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip backend code
        working-directory: ./backend
        run: |
          powershell -command "Compress-Archive -Path * -DestinationPath ../backend.zip -Force"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend.zip
          path: backend.zip

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend.zip
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: freelancehub-api-edubw3ephznye
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
