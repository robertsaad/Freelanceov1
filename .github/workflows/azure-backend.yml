name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # -----------------------------
      # 1. Checkout Code
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ---------------------------------------------------
      # 3. Install Dependencies (inside backend directory)
      # ---------------------------------------------------
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------
      # 4. Create ZIP (excluding venv + caches)
      # ---------------------------------------------------
      - name: Create backend.zip package
        working-directory: ./backend
        run: |
          $items = Get-ChildItem -Path . -Exclude env, __pycache__, *.zip
          Compress-Archive -Path $items -DestinationPath ../backend-package.zip -Force

      # ---------------------------------------------------
      # 5. Upload Artifact
      # ---------------------------------------------------
      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip
          compression-level: 0

      # ---------------------------------------------------
      # 6. Azure Login
      # ---------------------------------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------
      # 7. Deploy ZIP to Azure Web App
      # ---------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "freelancehub-api-edubw3ephznye"
          package: backend-package.zip
