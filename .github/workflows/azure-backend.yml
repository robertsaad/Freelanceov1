name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create backend.zip (exclude env + caches)
        shell: pwsh
        run: |
          $exclude = @("env", "__pycache__", "*.zip")
          $items = Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch "env" -and $_.FullName -notmatch "__pycache__"
          }
          Compress-Archive -Path $items.FullName -DestinationPath ../backend.zip -Force

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend.zip