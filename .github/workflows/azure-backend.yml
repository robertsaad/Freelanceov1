name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/azure-backend.yml

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip backend code
        run: |
          $exclude = @("env", "__pycache__", "*.zip")
          $items = Get-ChildItem -Path . -Recurse | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items -DestinationPath ../backend-package.zip -Force

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip
