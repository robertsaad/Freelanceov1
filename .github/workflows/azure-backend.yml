name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend.yml"

jobs:
  build-and-deploy:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3) Install backend dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) Create a zip of the backend (excluding venv & caches)
      - name: Create backend deployment package
        run: |
          $exclude = @("env", "__pycache__", "*.zip")
          $items = Get-ChildItem -Path . -Recurse | Where-Object {
            ($_.FullName -notlike "*\env\*") -and
            ($_.FullName -notlike "*\__pycache__\*") -and
            ($_.Name -notlike "*.zip")
          }
          Compress-Archive -Path $items -DestinationPath ..\backend.zip -Force

      # 5) Deploy to Azure Web App using publish profile
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: freelancehub-api-edubw3ephznye
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
